[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tvi"
version = "0.1.0"
description = "Technology Value Intelligence - TBM / ITFM / Technology Value Realization"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Technology Value Intelligence Team" }
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "duckdb>=1.0.0",
    "networkx>=3.2.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "jupyterlab>=4.1.0",
    "notebook>=7.1.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
    "pytest>=8.1.0",
    "tabulate>=0.9.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=4.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
